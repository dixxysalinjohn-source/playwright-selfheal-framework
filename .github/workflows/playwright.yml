name: Playwright SelfHeal CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2 AM - your 2 AM failure case

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        
      - name: Build Page and Test (Your Agents)
        run: |
          node AiAgents/BuildPageAgent.js
          node AiAgents/BuildTestAgent.js
        continue-on-error: true
          
      - name: Run Playwright tests - First Attempt
        id: first_run
        run: npx playwright test
        continue-on-error: true
        
      - name: SelfHeal if Failed
        if: steps.first_run.outcome == 'failure'
        run: |
          echo "Tests failed, triggering SelfHealAgent..."
          node AiAgents/SelfHealAgent.js
          
      - name: Run Playwright tests - After Heal
        if: steps.first_run.outcome == 'failure'
        run: npx playwright test
        
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7